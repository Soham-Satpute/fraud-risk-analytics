# render.yaml — Render Web Service Blueprint (Free Tier)
services:
  - type: web
    name: fraud-risk-api
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: "http://localhost:3000,https://*.vercel.app"
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard from Supabase connection string
